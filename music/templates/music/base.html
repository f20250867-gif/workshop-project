{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GrooveBox{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'music/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <span class="nav-brand">GrooveBox</span>
        <span class="nav-tag">backend workshop build</span>
    </nav>

    <main>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} GrooveBox</p>
    </footer>
</body>
</html>
